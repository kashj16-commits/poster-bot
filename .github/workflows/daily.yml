name: Daily Poster Generator

on:
  schedule:
    # Runs at 8:00 AM UTC every day. Adjust the time to your timezone
    # (GitHub Actions cron is always in UTC).
    - cron: "0 8 * * *"
  workflow_dispatch: {}  # lets you also trigger it manually from the Actions tab

jobs:
  generate-and-publish:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run poster bot
        env:
          FAL_KEY: ${{ secrets.FAL_KEY }}
          PRINTIFY_API_TOKEN: ${{ secrets.PRINTIFY_API_TOKEN }}
        run: python poster_bot.py
